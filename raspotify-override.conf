[Service]
# pi kullanicisi: bluealsa (Bluetooth ses) erisimi ve dashboard'un okuyacagi /run/raspotify
User=pi
Group=pi
SupplementaryGroups=audio
Environment=LIBRESPOT_NAME="Pi Panel"
Environment=LIBRESPOT_DEVICE_TYPE=speaker
Environment=LIBRESPOT_DEVICE=bluealsa:DEV=00:00:00:00:00:00,PROFILE=a2dp
Environment=LIBRESPOT_BITRATE=160
Environment=LIBRESPOT_ONEVENT=/usr/local/bin/spotify-event
Environment=LIBRESPOT_INITIAL_VOLUME=70
